<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LoopX – n8n Automation Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06415f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="drawer">
  <div class="brandrow"><div class="brand"><img src="icon-192.png" alt=""><span>LoopX</span></div><button id="closeL" class="round" data-ico="x"></button></div>
  <button class="newbill" data-go="chat" data-new="1"><i data-ico="plus"></i><span><b>New Chat</b><small>Send to your automation</small></span></button>
  <div class="cap">Theme</div><div id="themes"></div>
  <div class="cap">Menu</div>
  <nav class="menu"><button data-go="home"><i data-ico="home"></i>Home</button><button data-go="chat"><i data-ico="chat"></i>Chat</button><button data-go="flows"><i data-ico="flow"></i>Automations</button><button data-go="outs"><i data-ico="out"></i>Outputs</button></nav>
  <div class="cap">History</div><ul id="history"></ul>
</aside>
<div id="main">
  <header id="top"><button id="btnMenu" class="round" data-ico="menu"></button><div class="brand"><img src="icon-192.png" alt=""><span>LoopX</span></div><span id="pill"></span><button id="btnOut" class="round" data-ico="out"></button></header>
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-chat">
    <div class="chatbar"><select id="chatApp"></select></div>
    <div id="msgs"></div>
    <div id="composer"><textarea id="input" rows="1" placeholder="Message your automation…"></textarea><button id="send" class="sendbtn" data-ico="send"></button></div>
  </section>
  <section class="screen" id="s-flows"></section>
  <section class="screen" id="s-outs"></section>
  <nav id="nav"><button data-go="home"><i data-ico="home"></i>Home</button><button data-go="flows"><i data-ico="flow"></i>Flows</button><button class="fab" data-go="chat" data-new="1" data-ico="plus"></button><button data-go="chat"><i data-ico="chat"></i>Chat</button><button data-go="outs"><i data-ico="out"></i>Outputs</button></nav>
</div>
<aside id="sheet"><div class="brandrow"><b id="sheetTitle">Output</b><button id="closeR" class="round" data-ico="x"></button></div><div id="dash"></div></aside>
<div id="scrim"></div><div id="toast"></div>
<dialog id="dlg"><form method="dialog"><h3>Connect automation</h3>
  <label>Name<input id="fName" placeholder="e.g. Lead follow-up"></label>
  <label>n8n webhook URL<input id="fUrl" inputmode="url" placeholder="http://192.168.1.20:5678/webhook/loopx"></label>
  <label>Access token (optional)<input id="fTok" placeholder="Sent as Bearer token"></label>
  <div class="btns"><button value="cancel">Cancel</button><button class="primary" id="fSave" value="ok">Save</button></div></form></dialog>
<script src="util.js"></script><script src="storage.js"></script><script src="workflow.js"></script><script src="n8n.js"></script><script src="dashboard.js"></script><script src="chat.js"></script><script src="sidebar.js"></script><script src="screens.js"></script><script src="main.js"></script>
</body>
</html>
